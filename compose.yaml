name: sample-notifier

x-app-environment: &app-environment
  NODE_ENV: development
  HOST: 0.0.0.0
  PORT: 3000
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
  REDIS_URL: redis://redis:6379
  QUEUE_NAME: notifier-demo
  EVENT_CHANNEL: notifier-demo:events
  SESSION_SECRET: ${SESSION_SECRET:-local-tutorial-secret-change-before-production}
  TASK_DELAY_MS: ${TASK_DELAY_MS:-1200}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}

x-app: &app
  build:
    context: .
    target: runtime
  environment: *app-environment
  depends_on:
    redis:
      condition: service_healthy
  init: true
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  api:
    <<: *app
    command: ["node", "src/start-api.js"]
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  worker:
    <<: *app
    command: ["node", "src/start-worker.js"]

  redis:
    image: redis:8.2.8-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--save",
        "60",
        "1",
      ]
    expose:
      - "6379"
    volumes:
      - notifier-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true

  test:
    profiles:
      - test
    build:
      context: .
      target: test
    environment:
      TEST_REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  notifier-data:
